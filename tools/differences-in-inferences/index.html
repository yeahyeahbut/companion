<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Differences-in-Inferences — a companion tool to Yeah, Yeah, But… and Therefore</title>
<meta name="description" content="A companion tool to Yeah, Yeah, But… and Therefore (Christopher I. Rider) for structuring a paper around the differences-in-inferences architecture: replicate, diverge, reconcile." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Book identity — sampled from the V0.2.2 figures and the core-argument infographic */
    --coral: #C9472F;
    --coral-deep: #A93A25;
    --wash: #FBEAE4;
    --wash-2: #F6DBD3;
    --bg: #F7F5F4;
    --paper: #FFFFFF;
    --ink: #1A1A1A;
    --muted: #5A5A5E;
    --muted-2: #6E6E73;
    --rule: #D9D7DE;
    --rule-2: #C5C4CB;
    --shadow: 0 1px 0 rgba(0,0,0,.03), 0 8px 24px -18px rgba(26,26,26,.22);
    --display: "Gelasio", Georgia, "Times New Roman", serif;
    --serif: "Gelasio", Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.55;
    font-feature-settings: "kern", "liga", "onum";
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }
  textarea, input { font-family: var(--serif); }

  /* ---- Header ---- */
  header.site {
    border-bottom: 1px solid var(--rule);
    background: var(--paper);
    padding: 22px 36px 14px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 24px;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  header.site::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -4px;
    height: 4px;
    background: linear-gradient(90deg, var(--coral) 0%, var(--coral) 38%, transparent 38%);
  }
  .brand .eyebrow {
    font-family: var(--display);
    letter-spacing: .22em;
    color: var(--coral);
    font-size: 14px;
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 10px;
  }
  .brand .eyebrow .dot {
    width: 8px; height: 8px; background: var(--coral); border-radius: 50%;
    box-shadow: 0 0 0 3px rgba(201,71,47,.18);
  }
  .brand h1 {
    font-family: var(--display);
    font-weight: 400;
    color: var(--coral);
    margin: 0;
    font-size: clamp(34px, 4.4vw, 52px);
    letter-spacing: .015em;
    line-height: .95;
  }
  .brand .subtitle {
    font-family: var(--serif);
    font-style: italic;
    color: var(--muted);
    font-size: 16px;
    margin: 6px 0 0;
  }
  .header-actions {
    display: flex; gap: 8px; align-items: center;
  }

  /* ---- Buttons ---- */
  .btn {
    border: 1px solid var(--rule-2);
    background: var(--paper);
    color: var(--coral);
    padding: 9px 14px;
    font-size: 13px;
    font-family: var(--display);
    letter-spacing: .14em;
    border-radius: 2px;
    transition: all .15s ease;
  }
  .btn:hover { background: var(--wash); border-color: var(--coral); }
  .btn.primary {
    background: var(--coral); color: var(--paper); border-color: var(--coral);
  }
  .btn.primary:hover { background: var(--coral-deep); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--coral); background: transparent; }
  .btn.accent {
    background: var(--coral); color: var(--paper); border-color: var(--coral);
  }
  .btn.accent:hover { background: var(--coral-deep); border-color: var(--coral-deep); }
  .btn[disabled] { opacity: .35; cursor: not-allowed; }

  /* ---- Layout ---- */
  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: calc(100vh - 95px);
    max-width: 1320px;
    margin: 0 auto;
  }
  aside.sidebar {
    border-right: 1px solid var(--rule);
    padding: 32px 0 60px;
    background: var(--bg);
    position: sticky;
    top: 95px;
    height: calc(100vh - 95px);
    overflow-y: auto;
  }
  .nav-title {
    font-family: var(--display);
    font-size: 12px;
    letter-spacing: .22em;
    color: var(--muted);
    padding: 0 28px 14px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 8px;
  }
  nav.steps { list-style: none; padding: 0; margin: 0; }
  nav.steps button.step {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 11px 28px 11px 24px;
    border-left: 4px solid transparent;
    color: var(--muted);
    font-family: var(--serif);
    font-size: 15.5px;
    line-height: 1.3;
    display: grid;
    grid-template-columns: 22px 1fr;
    gap: 10px;
    align-items: start;
  }
  nav.steps button.step:hover { color: var(--coral); background: rgba(201,71,47,.05); }
  nav.steps button.step.active {
    color: var(--coral);
    border-left-color: var(--coral);
    background: var(--paper);
    font-weight: 600;
  }
  nav.steps button.step .num {
    font-family: var(--display);
    color: var(--coral);
    font-size: 14px;
    letter-spacing: .04em;
    padding-top: 2px;
  }
  nav.steps button.step .marker {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--rule);
    margin-left: 6px;
    vertical-align: middle;
    flex-shrink: 0;
  }
  nav.steps button.step .marker.partial { background: var(--wash); border: 1px solid var(--coral); }
  nav.steps button.step .marker.full { background: var(--coral); }

  .progress-wrap {
    padding: 22px 28px 0;
    border-top: 1px solid var(--rule);
    margin-top: 16px;
  }
  .progress-label {
    display: flex; justify-content: space-between;
    font-family: var(--display);
    font-size: 12px;
    letter-spacing: .18em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .progress-bar {
    height: 5px; background: var(--rule); border-radius: 99px; overflow: hidden;
  }
  .progress-fill { height: 100%; background: var(--coral); transition: width .3s ease; }

  /* ---- Main ---- */
  main {
    padding: 56px 64px 120px;
    max-width: 880px;
    width: 100%;
  }
  .step-eyebrow {
    font-family: var(--display);
    letter-spacing: .22em;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 14px;
  }
  .step-eyebrow .pipe { color: var(--coral); margin: 0 10px; }
  h2.step-title {
    font-family: var(--display);
    font-weight: 400;
    color: var(--coral);
    font-size: clamp(40px, 4.5vw, 56px);
    line-height: .98;
    margin: 0 0 18px;
    letter-spacing: .005em;
  }
  .step-lede {
    font-size: 19px;
    line-height: 1.55;
    color: var(--ink);
    max-width: 64ch;
    margin: 0 0 12px;
  }
  .step-lede em { color: var(--coral); font-style: italic; }
  .step-meta {
    display: flex; gap: 18px; align-items: center;
    margin: 22px 0 28px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--rule);
    flex-wrap: wrap;
  }
  .example-toggle {
    background: var(--paper);
    border: 1px solid var(--rule-2);
    color: var(--coral);
    padding: 7px 12px 7px 10px;
    font-size: 13px;
    font-family: var(--serif);
    border-radius: 2px;
    display: inline-flex; align-items: center; gap: 8px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .example-toggle:hover { background: var(--wash); }
  .example-toggle.on { background: var(--coral); color: var(--paper); border-color: var(--coral); }
  .example-toggle .swatch {
    display: inline-block; width: 10px; height: 10px; background: var(--coral); border-radius: 1px;
  }
  .example-toggle.on .swatch { background: var(--coral); }
  .optional-badge {
    font-family: var(--display);
    letter-spacing: .18em;
    font-size: 12px;
    color: var(--muted);
    border: 1px solid var(--rule-2);
    padding: 4px 8px;
    border-radius: 2px;
  }

  /* ---- Field group ---- */
  .field {
    margin: 0 0 26px;
  }
  .field label {
    display: block;
    font-family: var(--serif);
    font-weight: 600;
    font-size: 16px;
    color: var(--coral);
    margin-bottom: 6px;
  }
  .field .prompt {
    font-size: 14.5px;
    color: var(--muted);
    margin-bottom: 8px;
    font-style: italic;
    line-height: 1.5;
  }
  .field textarea, .field input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--rule-2);
    border-radius: 2px;
    background: var(--paper);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.5;
    transition: border-color .15s, box-shadow .15s;
    resize: vertical;
  }
  .field textarea { min-height: 84px; }
  .field textarea:focus, .field input[type="text"]:focus {
    outline: none;
    border-color: var(--coral);
    box-shadow: 0 0 0 3px rgba(201,71,47,.16);
  }
  .field .example {
    display: none;
    margin-top: 10px;
    padding: 12px 14px 12px 16px;
    background: var(--wash);
    border-left: 3px solid var(--coral);
    font-size: 14.5px;
    line-height: 1.5;
    color: #4A2A20;
    border-radius: 0 2px 2px 0;
  }
  .field .example.on { display: block; }
  .field .example .ex-label {
    font-family: var(--display);
    letter-spacing: .18em;
    font-size: 11px;
    color: #A93A25;
    margin-bottom: 4px;
    display: block;
  }

  .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 800px) { .field-grid { grid-template-columns: 1fr; } }

  /* Three-model card group */
  .model-card {
    border: 1px solid var(--rule-2);
    background: var(--paper);
    padding: 22px 24px 12px;
    margin-bottom: 22px;
    border-radius: 2px;
    position: relative;
  }
  .model-card::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--coral);
  }
  .model-card.m2::before { background: var(--coral); }
  .model-card.m3::before { background: linear-gradient(180deg, var(--coral) 0%, var(--coral) 50%, var(--coral) 50%, var(--coral) 100%); }
  .model-card .card-header {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--rule);
  }
  .model-card h3 {
    font-family: var(--display);
    font-weight: 400;
    color: var(--coral);
    font-size: 26px;
    margin: 0;
    letter-spacing: .02em;
  }
  .model-card .role-tag {
    font-family: var(--serif);
    font-style: italic;
    color: var(--muted);
    font-size: 14px;
  }

  /* Stress test panel */
  .stress-panel {
    background: var(--paper);
    border: 1px dashed var(--rule-2);
    padding: 18px 22px 6px;
    margin-top: 8px;
    margin-bottom: 28px;
    border-radius: 2px;
  }
  .stress-panel h4 {
    font-family: var(--display);
    color: var(--coral);
    font-size: 18px;
    letter-spacing: .08em;
    margin: 0 0 10px;
  }
  .stress-panel ul { margin: 0 0 12px 18px; padding: 0; font-size: 15px; color: var(--muted); }
  .stress-panel li { margin-bottom: 6px; line-height: 1.5; }
  .stress-panel .legend-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 26px;
    margin-bottom: 12px;
  }
  @media (max-width: 800px) { .stress-panel .legend-grid { grid-template-columns: 1fr; } }
  .stress-panel .legend-row {
    display: grid;
    grid-template-columns: 22px 1fr;
    gap: 12px;
    align-items: start;
    font-size: 14.5px;
    color: var(--ink);
    line-height: 1.5;
  }
  .stress-panel .legend-row .swatch {
    width: 18px; height: 18px; border-radius: 2px; margin-top: 2px;
  }
  .stress-panel .legend-row .sw-main { background: var(--coral); }
  .stress-panel .legend-row .sw-aux  { background: var(--coral); }
  .stress-panel .legend-row .sw-alt  { background: #F2EFEE; border: 1.5px dashed #6E6E73; box-sizing: border-box; }
  .stress-panel .legend-row .sw-obs  { background: #F4F2F1; border: 1px solid #C5C4CB; box-sizing: border-box; }
  .stress-panel .legend-row .sw-not  { background: #FBEAE4; border: 1px solid #C9472F; box-sizing: border-box; }
  .stress-panel .legend-row strong { color: var(--coral); }

  /* Pull quote */
  .pull-quote {
    border-left: 5px solid var(--coral);
    padding: 14px 22px;
    margin: 32px 0;
    font-style: italic;
    color: var(--coral);
    font-size: 22px;
    line-height: 1.4;
    font-family: var(--serif);
    background: var(--paper);
  }
  .pull-quote cite {
    display: block;
    font-style: normal;
    font-family: var(--display);
    letter-spacing: .18em;
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
  }

  /* Intro / review specials */
  .intro-card {
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 36px 40px;
    margin-bottom: 28px;
    border-radius: 2px;
    box-shadow: var(--shadow);
  }
  .intro-card h3 {
    font-family: var(--display);
    color: var(--coral);
    font-size: 22px;
    letter-spacing: .08em;
    margin: 0 0 14px;
  }
  .commitment-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 18px;
    margin: 28px 0 8px;
  }
  @media (max-width: 800px) { .commitment-grid { grid-template-columns: 1fr; } }
  .commitment {
    padding: 18px 20px 20px;
    border-top: 3px solid var(--coral);
    background: var(--paper);
    border-left: 1px solid var(--rule);
    border-right: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }
  .commitment .num {
    font-family: var(--display);
    color: var(--coral);
    font-size: 32px;
    line-height: 1;
    margin-bottom: 4px;
  }
  .commitment h4 {
    font-family: var(--display);
    letter-spacing: .14em;
    font-size: 17px;
    color: var(--coral);
    margin: 2px 0 4px;
  }
  .commitment .argbeat {
    font-family: var(--serif);
    font-style: italic;
    font-size: 14.5px;
    color: #A93A25;
    margin-bottom: 8px;
    letter-spacing: -.005em;
  }
  .commitment p { margin: 0; font-size: 15.5px; line-height: 1.5; }

  /* Review screen */
  .review-section { margin-bottom: 36px; }
  .review-section h3 {
    font-family: var(--display);
    color: var(--coral);
    font-size: 22px;
    letter-spacing: .04em;
    margin: 0 0 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule);
  }
  .review-item {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 18px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--rule);
  }
  .review-item .k {
    font-weight: 600;
    color: var(--coral);
    font-size: 14.5px;
  }
  .review-item .v {
    font-size: 15.5px;
    line-height: 1.55;
    color: var(--ink);
    white-space: pre-wrap;
  }
  .review-item .v.empty {
    color: var(--muted-2); font-style: italic;
  }

  /* ---- Footer nav ---- */
  footer.fnav {
    border-top: 1px solid var(--rule);
    background: var(--paper);
    padding: 16px 36px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    position: sticky;
    bottom: 0;
    z-index: 15;
  }
  footer.fnav .center {
    font-family: var(--display);
    letter-spacing: .18em;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }
  footer.fnav .right { display: flex; justify-content: flex-end; gap: 8px; }
  footer.fnav .left  { display: flex; gap: 8px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 96px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--coral);
    color: var(--paper);
    padding: 10px 18px;
    font-family: var(--display);
    letter-spacing: .12em;
    font-size: 13px;
    border-radius: 2px;
    opacity: 0;
    pointer-events: none;
    transition: all .25s ease;
    z-index: 50;
    box-shadow: 0 12px 24px -8px rgba(0,0,0,.3);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Modal */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(26, 26, 26, .48);
    display: none; align-items: center; justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-bg.on { display: flex; }
  .modal {
    background: var(--paper);
    border-radius: 2px;
    max-width: 480px;
    width: 100%;
    padding: 28px 32px 24px;
    box-shadow: 0 20px 60px -10px rgba(0,0,0,.4);
  }
  .modal h3 {
    font-family: var(--display);
    color: var(--coral);
    font-size: 24px;
    letter-spacing: .04em;
    margin: 0 0 12px;
  }
  .modal p { margin: 0 0 20px; color: var(--muted); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

  /* ---- Elster diagram ---- */
  .diagram-wrap {
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 28px 24px 22px;
    margin: 4px 0 28px;
    border-radius: 2px;
    box-shadow: var(--shadow);
  }
  .diagram-wrap.compact { padding: 18px 16px 14px; }
  .diagram-wrap svg { width: 100%; height: auto; display: block; }
  .diagram-legend {
    display: flex; flex-wrap: wrap; gap: 18px 22px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
    font-size: 13px;
    color: var(--muted);
  }
  .diagram-legend .key {
    display: inline-flex; align-items: center; gap: 8px;
  }
  .diagram-legend .swatch {
    width: 14px; height: 14px; border-radius: 2px; display: inline-block;
    flex-shrink: 0;
  }
  .diagram-legend .sw-main   { background: var(--coral); }
  .diagram-legend .sw-aux    { background: var(--coral); }
  .diagram-legend .sw-alt    { background: #F2EFEE; border: 1px dashed #6E6E73; }
  .diagram-legend .sw-obs    { background: #F4F2F1; border: 1px solid #C5C4CB; }
  .diagram-legend .sw-not    { background: #FBEAE4; border: 1px solid #C9472F; }

  /* SVG-internal styles via foreignObject HTML */
  .dia-box {
    height: 100%;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    font-family: var(--serif);
    font-size: 12px;
    padding: 7px 11px;
    border-radius: 2px;
    line-height: 1.32;
    box-sizing: border-box;
    overflow: hidden;
  }
  .dia-box .dia-label {
    font-family: var(--display);
    letter-spacing: .14em;
    font-size: 9px;
    margin-bottom: 3px;
    text-transform: uppercase;
    opacity: .82;
  }
  .dia-box .dia-text {
    font-size: 11.5px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .dia-theory, .dia-hyp, .dia-expl {
    background: var(--coral);
    color: white;
    border: 1px solid var(--coral);
  }
  .dia-hyp { background: var(--coral-deep); }
  .dia-expl { background: linear-gradient(90deg, var(--coral) 0%, var(--coral) 88%, var(--coral) 88%, var(--coral) 100%); }
  .dia-aux {
    background: var(--coral);
    color: #3A2018;
    border: 1px solid #E0B6A7;
  }
  .dia-aux .dia-label { color: #A93A25; opacity: 1; }
  .dia-alt {
    background: #F2EFEE;
    color: #4A4A4C;
    border: 1.5px dashed #6E6E73;
  }
  .dia-alt .dia-label { color: #5A5A5E; opacity: 1; }
  .dia-imp {
    background: #F4F2F1;
    border: 1px solid #C5C4CB;
    color: #2C2C2E;
  }
  .dia-imp.dia-not-obs {
    background: #FBEAE4;
    border: 1px solid #C9472F;
    color: #5A2018;
  }
  .dia-imp.dia-not-obs .dia-label { color: #A93A25; }

  /* Customize labels panel */
  .fulltext-panel {
    margin-top: 22px;
    border: 1px solid var(--rule);
    border-radius: 2px;
    background: var(--paper);
    padding: 18px 20px 12px;
  }
  .fulltext-panel h4 {
    font-family: var(--display);
    letter-spacing: .14em;
    font-size: 13px;
    color: var(--coral);

const STORAGE_KEY = "dii_template_v1";

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return {};
}
function saveState(silent) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    localStorage.setItem(STORAGE_STEP, String(currentStep));
    localStorage.setItem(STORAGE_EX, JSON.stringify(examplesShown));
  } catch (e) {}
  if (!silent) toast("Saved");
}

function renderNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = SECTIONS.map((s, i) => {
    const status = sectionStatus(s);
    const cls = i === currentStep ? "step active" : "step";
    return `
      <button class="${cls}" data-step="${i}">
        <span class="num">${i === 0 ? "•" : (i === SECTIONS.length - 1 ? "✓" : i.toString().padStart(2, "0"))}</span>
        <span class="lab">${s.nav}<span class="marker ${status}"></span></span>
      </button>`;
  }).join("");
  nav.querySelectorAll("button.step").forEach(b => {
    b.addEventListener("click", () => goTo(parseInt(b.dataset.step)));
  });
  updateProgress();
}

function sectionStatus(s) {
  if (!s.fields && s.custom !== "three_model") return "";
  let fields = s.fields || [];
  if (s.custom === "three_model") {
    fields = [
      {id:"m1_spec"},{id:"m1_inf"},
      {id:"m2_spec"},{id:"m2_inf"},
      {id:"m3_spec"},{id:"m3_inf"}
    ];
  }
  const total = fields.length;
  const filled = fields.filter(f => state[f.id] && state[f.id].trim()).length;
  if (filled === 0) return "";
  if (filled === total) return "full";
  return "partial";
}

function updateProgress() {
  const sections = SECTIONS.filter(s => s.fields || s.custom === "three_model");
  let total = 0, filled = 0;
  sections.forEach(s => {
    let fields = s.fields || [];
    if (s.custom === "three_model") {
      fields = [{id:"m1_spec"},{id:"m1_inf"},{id:"m2_spec"},{id:"m2_inf"},{id:"m3_spec"},{id:"m3_inf"}];
    }
    total += fields.length;
    filled += fields.filter(f => state[f.id] && state[f.id].trim()).length;
  });
  const pct = total ? Math.round((filled / total) * 100) : 0;
  document.getElementById("progress-pct").textContent = pct + "%";
  document.getElementById("progress-fill").style.width = pct + "%";
}

function renderMain() {
  const s = SECTIONS[currentStep];
  const main = document.getElementById("main");
  let body = "";

  if (s.custom === "intro") {
    body = renderIntro();
  } else if (s.custom === "review") {
    body = renderReview();
  } else if (s.custom === "three_model") {
    body = renderThreeModel(s);
  } else if (s.custom === "diagram") {
    body = renderDiagram(s);
  } else {
    body = renderStandard(s);
  }

  main.innerHTML = body;
  attachFieldHandlers();
  attachExampleToggle(s);

  // Update step indicator
  document.getElementById("step-indicator").textContent =
    "Step " + (currentStep + 1) + " of " + SECTIONS.length;
  document.getElementById("btn-prev").disabled = currentStep === 0;
  const nextBtn = document.getElementById("btn-next");
  nextBtn.disabled = currentStep === SECTIONS.length - 1;
  nextBtn.textContent = currentStep === SECTIONS.length - 2 ? "Review →" : "Next →";

  // Scroll to top
  main.scrollIntoView({behavior: "instant", block: "start"});
  window.scrollTo({top: 0, behavior: "instant"});
}

const DIAGRAM_LABELS = [
  { key: "dia_explanandum", label: "Explanandum",                from: "focal_phenomenon", fallback: "What is to be explained" },
  { key: "dia_m1",          label: "M1 · preferred",             from: "preferred_xy",     fallback: "Preferred mechanism: X → Y" },
  { key: "dia_m2",          label: "M2 · rival",                 from: "reverse_yx",       fallback: "Rival mechanism: Y → X" },
  { key: "dia_m3",          label: "M3 · rival",                 from: "omitted_z",        fallback: "Rival mechanism: Z → Y, Z ↔ X" },
  { key: "dia_above1",      label: "M1 — support from above",    from: "support_above",    fallback: "The accepted account M1 is a special case of" },
  { key: "dia_above2",      label: "M2 — support from above",    from: "m2_above",         fallback: "The accepted account M2 is a special case of" },
  { key: "dia_above3",      label: "M3 — support from above",    from: "m3_above",         fallback: "The accepted account M3 is a special case of" },
  { key: "dia_sig1",        label: "M1 — signature",             from: "support_below",    fallback: "What M1 would leave in the data if it were the one running" },
  { key: "dia_sig2",        label: "M2 — signature",             from: "m2_below",         fallback: "What M2 would leave in the data if it were the one running" },
  { key: "dia_sig3",        label: "M3 — signature",             from: "m3_below",         fallback: "What M3 would leave in the data if it were the one running" },
  { key: "dia_lateral",     label: "Lateral — the discriminating observation", from: "support_lateral", fallback: "The observation one story predicts and another forbids" }
];

function shortenForDiagram(text, maxLen) {
  if (!text) return "";
  maxLen = maxLen || 92;
  text = text.trim();
  if (text.length <= maxLen) return text;
  const clauseCut = text.slice(0, maxLen).match(/^.*[,;:—–-]\s/);
  if (clauseCut && clauseCut[0].length >= 30) return clauseCut[0].trim().replace(/[,;:—–-]\s*$/, "") + "…";
  const m = text.match(/^[^.!?]+[.!?]/);
  if (m && m[0].length <= maxLen) return m[0].trim();
  return text.slice(0, maxLen - 1).trim() + "…";
}

// Full, untruncated source text for a diagram key.
function diagramFullText(key) {
  const def = DIAGRAM_LABELS.find(d => d.key === key);
  if (!def) return "";
  if (state[key] && state[key].trim()) return state[key].trim();
  const prose = def.from ? state[def.from] : "";
  if (prose && prose.trim()) {
    if (typeof def.sentenceIdx === "number") {
      const s = nthSentence(prose, def.sentenceIdx);
      if (s) return s;
      if (def.sentenceIdx > 0) return def.fallback;
      return prose.trim();
    }
    return prose.trim();
  }
  return def.fallback;
}

function nthSentence(text, idx) {
  if (!text) return "";
  const parts = text.trim().match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g);
  if (!parts) return idx === 0 ? text : "";
  const trimmed = parts.map(p => p.trim()).filter(Boolean);
  if (idx >= trimmed.length) return "";
  return trimmed[idx];
}

function diagramLabel(key) {
  const def = DIAGRAM_LABELS.find(d => d.key === key);
  if (!def) return "";
  if (state[key] && state[key].trim()) return state[key].trim();
  const prose = def.from ? state[def.from] : "";
  if (prose && prose.trim()) {
    if (typeof def.sentenceIdx === "number") {
      const s = nthSentence(prose, def.sentenceIdx);
      if (s) return shortenForDiagram(s);
      if (def.sentenceIdx > 0) return def.fallback;
      return shortenForDiagram(prose);
    }
    return shortenForDiagram(prose);
  }
  return def.fallback;
}

/* Layout after Figure 3.1 of the manuscript: the three mechanisms stand in one
   column at the same size and the same weight, the explanandum sits to the
   right, and each mechanism carries its own italic signature beneath it.
   The three supports are drawn as three QUESTIONS asked of each mechanism in
   turn, not as three regions of the picture (§3.2). */
function buildDiagramSvg() {
  const L = {};
  DIAGRAM_LABELS.forEach(d => { L[d.key] = diagramLabel(d.key); });

  const rows = [
    { top: 100, mech: "dia_m1", above: "dia_above1", sig: "dia_sig1", tag: "M1 · PREFERRED", pref: true },
    { top: 272, mech: "dia_m2", above: "dia_above2", sig: "dia_sig2", tag: "M2 · RIVAL",     pref: false },
    { top: 444, mech: "dia_m3", above: "dia_above3", sig: "dia_sig3", tag: "M3 · RIVAL",     pref: false }
  ];

  const out = [
    '<svg viewBox="0 0 980 730" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Elster diagram: three mechanisms on equal footing, each with a higher-level theory above it and its signature beneath it">',
    '<defs>',
      '<marker id="arr-coral" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C9472F"/></marker>',
      '<marker id="arr-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker>',
    '</defs>',

    // Header band — the correction §3.2 was rewritten to make
    '<text x="490" y="26" text-anchor="middle" fill="#C9472F" font-family="Gelasio, Georgia, serif" font-weight="700" font-size="13" letter-spacing="2.6">THREE QUESTIONS, ASKED OF EACH MECHANISM IN TURN</text>',
    '<text x="490" y="46" text-anchor="middle" fill="#6E6E73" font-family="Gelasio, Georgia, serif" font-style="italic" font-size="12.5">Three mechanisms, nine answers — above, below, and laterally, for each story in the column.</text>',
    '<line x1="20" y1="62" x2="960" y2="62" stroke="#D9D7DE" stroke-width="1"/>',
    '<text x="125" y="84" text-anchor="middle" fill="#6E6E73" font-family="Gelasio, Georgia, serif" font-weight="700" font-size="10.5" letter-spacing="2.2">SUPPORT FROM ABOVE</text>',
    '<text x="410" y="84" text-anchor="middle" fill="#6E6E73" font-family="Gelasio, Georgia, serif" font-weight="700" font-size="10.5" letter-spacing="2.2">THE MECHANISM, AND ITS SIGNATURE BELOW</text>',
    '<text x="830" y="84" text-anchor="middle" fill="#6E6E73" font-family="Gelasio, Georgia, serif" font-weight="700" font-size="10.5" letter-spacing="2.2">EXPLANANDUM</text>'
  ];

  rows.forEach(r => {
    const mechY = r.top;
    const sigY  = r.top + 84;
    // support from above
    out.push(diagramBox(20, mechY + 6, 200, 66, "dia-theory", r.tag.split(" ")[0] + " stands under", L[r.above]));
    out.push('<path d="M 220 ' + (mechY + 39) + ' L 254 ' + (mechY + 39) + '" fill="none" stroke="#6E6E73" stroke-width="1.6" marker-end="url(#arr-ink)"/>');
    // the mechanism — identical geometry and weight for all three
    out.push(diagramBox(260, mechY, 300, 78, "dia-mech" + (r.pref ? " dia-preferred" : ""), r.tag, L[r.mech]));
    // its signature, beneath, in italic (support from below)
    out.push(diagramBox(260, sigY, 300, 62, "dia-sig", "Signature in the data", L[r.sig]));
    // to the explanandum — same stroke weight for every story; M1's arrow is coral
    const stroke = r.pref ? "#C9472F" : "#6E6E73";
    const marker = r.pref ? "url(#arr-coral)" : "url(#arr-ink)";
    out.push('<path d="M 560 ' + (mechY + 39) + ' C 640 ' + (mechY + 39) + ' 640 355 694 355" fill="none" stroke="' + stroke + '" stroke-width="2" marker-end="' + marker + '"/>');
  });

  // explanandum
  out.push(diagramBox(700, 300, 260, 110, "dia-expl", "Explanandum", L.dia_explanandum));

  // lateral band
  out.push('<line x1="20" y1="600" x2="960" y2="600" stroke="#D9D7DE" stroke-width="1"/>');
  out.push(diagramBox(20, 618, 940, 76, "dia-lat", "Lateral — which signature separates the stories?", L.dia_lateral));

  out.push('<text x="960" y="722" text-anchor="end" fill="#6E6E73" font-family="Gelasio, Georgia, serif" font-style="italic" font-size="11">After Elster (2015), the three supports</text>');
  out.push('</svg>');
  return out.join("");
}

function diagramBox(x, y, w, h, cls, label, text) {
  return '<foreignObject x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '">'
    + '<div xmlns="http://www.w3.org/1999/xhtml" class="dia-box ' + cls + '">'
    + '<div class="dia-label">' + escapeHtml(label) + '</div>'
    + '<div class="dia-text">' + escapeHtml(text || "—") + '</div>'
    + '</div></foreignObject>';
}

function renderDiagram(s) {
  return [
    '<div class="step-eyebrow">' + s.eyebrow + '</div>',

        '<span class="key"><span class="swatch sw-theory"></span>Support from above: the accepted account each story is a special case of</span>',
        '<span class="key"><span class="swatch sw-sig"></span>Support from below: each story\'s signature in the data</span>',
        '<span class="key"><span class="swatch sw-expl"></span>The explanandum — what all three stories would produce</span>',
      '</div>',
    '</div>',

        '<div class="fulltext-panel">',
      '<h4>Full text in each box</h4>',
      '<p class="fulltext-hint">Boxes in the diagram are condensed for legibility. The unabridged source text appears below — and is used in the printed and Markdown export.</p>',
      fulltextRow("Explanandum", "dia_explanandum"),
      fulltextRow("M1 · preferred", "dia_m1"),
      fulltextRow("M1 — support from above", "dia_above1"),
      fulltextRow("M1 — signature", "dia_sig1"),
      fulltextRow("M2 · rival", "dia_m2"),
      fulltextRow("M2 — support from above", "dia_above2"),
      fulltextRow("M2 — signature", "dia_sig2"),
      fulltextRow("M3 · rival", "dia_m3"),
      fulltextRow("M3 — support from above", "dia_above3"),
      fulltextRow("M3 — signature", "dia_sig3"),
      fulltextRow("Lateral — the discriminating observation", "dia_lateral"),
    '</div>',


    '<div class="labels-panel">',
      '<button class="labels-toggle" id="lab-toggle"><span>Customize diagram labels</span><span class="chev">›</span></button>',
      '<div class="labels-body" id="lab-body">',
        labelsBlock("What is to be explained", ["dia_explanandum"]),
        labelsBlock("M1 — the story you prefer", ["dia_m1", "dia_above1", "dia_sig1"]),
        labelsBlock("M2 — rival story", ["dia_m2", "dia_above2", "dia_sig2"]),
        labelsBlock("M3 — rival story", ["dia_m3", "dia_above3", "dia_sig3"]),
        labelsBlock("Lateral", ["dia_lateral"]),
      '</div>',
    '</div>',

    '<div class="stress-panel">',
      '<h4>How to read the figure</h4>',
      '<div class="legend-grid">',
        '<div class="legend-row"><span class="swatch sw-mech"></span><div><strong>The three boxes down the middle</strong> are the three stories, drawn at the same size and the same weight. A rival you have shrunk on the page is a rival you have not stated at full strength.</div></div>',
        '<div class="legend-row"><span class="swatch sw-pref"></span><div><strong>The coral outline and the coral arrow</strong> mark M1, the story you prefer. Preference is marked, not staged: the picture is an instrument of inference, not an advertisement.</div></div>',
        '<div class="legend-row"><span class="swatch sw-theory"></span><div><strong>Left of each story, support from above</strong>: the accepted body of work that story is a special case of. Your own mechanism is not its higher-level theory — name the roof it stands under.</div></div>',
        '<div class="legend-row"><span class="swatch sw-sig"></span><div><strong>Beneath each story, its signature</strong> — support from below. Derive it in one step from what the process spends: influence, ability, timing. Prefer the signature that is the shortest move from the mechanism.</div></div>',
        '<div class="legend-row"><span class="swatch sw-expl"></span><div><strong>Right, the explanandum</strong>: what all three stories would produce. That every arrow lands there is the difficulty — equifinality — and the reason the signatures have to diverge.</div></div>',
      '</div>',
      '<ul>',
        '<li><strong>Read the three signatures side by side.</strong> If they do not diverge, the diagram cannot adjudicate and the design has nothing to observe. That is the moment to go back to the stories, not forward to the data.</li>',
        '<li><strong>Nine answers, not three.</strong> Above, below, and laterally are three questions asked of each mechanism in turn. A blank cell is a story you have not yet made testable.</li>',
      '</ul>',
    '</div>'
  ].join("");
}

function fulltextRow(title, key) {
  const text = diagramFullText(key);
  return '<div class="ft-row">'
    + '<div class="ft-title">' + escapeHtml(title) + '</div>'
    + '<div class="ft-text">' + escapeHtml(text || "—") + '</div>'
    + '</div>';
}

function labelsBlock(title, keys) {
  let html = '<h5>' + escapeHtml(title) + '</h5>';
  keys.forEach(k => {
    const def = DIAGRAM_LABELS.find(d => d.key === k);
    const placeholder = def ? (def.from && state[def.from] ? shortenForDiagram(state[def.from]) : def.fallback) : "";
    const v = state[k] || "";
    html += '<div class="lab-field">'
      + '<label for="lf-' + k + '">' + escapeHtml(def ? def.label : k) + '</label>'
      + '<input type="text" id="lf-' + k + '" data-label-field="' + k + '" placeholder="' + escapeHtml(placeholder) + '" value="' + escapeHtml(v) + '" />'
      + '</div>';
  });
  return html;
}

function renderStandard(s) {
  const optBadge = s.optional ? `<span class="optional-badge">Optional</span>` : "";
  const exOn = examplesShown[s.id] ? "on" : "";
  return `
    <div class="step-eyebrow">${s.eyebrow}</div>
    <h2 class="step-title">${s.title}</h2>
    <p class="step-lede">${s.lede}</p>
    <div class="step-meta">
      <button class="example-toggle ${exOn}" data-toggle-ex="${s.id}">
        <span class="swatch"></span>
        <span>${examplesShown[s.id] ? "Hide" : "Show"} example: Sorenson &amp; Waguespack</span>
      </button>
      ${optBadge}
    </div>
    ${s.fields.map(f => fieldHtml(f, s.id)).join("")}
  `;
}

function renderThreeModel(s) {
  const exOn = examplesShown[s.id] ? "on" : "";
  const fields = [
    { id: "m1_spec", label: "Specification", prompt: "Sample, controls, and estimator that match the prior as closely as your data allow.",
      example: "Same panel and outcome construct as Uzzi (1997); cross-sectional OLS with industry and year fixed effects." },
    { id: "m1_inf", label: "Inference licensed", prompt: "What does this model permit you to claim?",
      example: "The established embedded-ties result holds in this sample at comparable magnitude." }
  ];
  const fields2 = [
    { id: "m2_spec", label: "Specification", prompt: "What does received practice already control for that Model 1 left out? Model 2 is the reader's best honest attempt — the estimate the field would produce with the controls it already trusts — so the number that moves cannot be dismissed as sloppiness. Save the identification strategy for Model 3.",
      example: "Decompose embeddedness into relational-history and expected-quality components using a two-stage approach with project uncertainty as moderator." },
    { id: "m2_inf", label: "Inference licensed", prompt: "What new inference does this model enable?",
      example: "The headline embeddedness effect is a mixture; its weight depends on project uncertainty in a theoretically predicted way." }
  ];
  const fields3 = [
    { id: "m3_spec", label: "Specification", prompt: "The reconciliation takes one of two forms. A boundary: an interaction or partition under which the prior holds in one regime and your result in the other. Or a bias: a design-based estimate that isolates the surviving mechanism. Say which, and say it before you estimate.",
      example: "Stratified by project uncertainty: low-uncertainty subsample reproduces Uzzi; high-uncertainty subsample reveals the expectations channel." },
    { id: "m3_inf", label: "Inference licensed", prompt: "How do the two findings coexist?",
      example: "The two mechanisms operate in different regimes; the prior holds where information problems are mild, the novel result where they bind." }
  ];

  return `
    <div class="step-eyebrow">${s.eyebrow}</div>
    <h2 class="step-title">${s.title}</h2>
    <p class="step-lede">${s.lede}</p>
    <div class="step-meta">
      <button class="example-toggle ${exOn}" data-toggle-ex="${s.id}">
        <span class="swatch"></span>
        <span>${examplesShown[s.id] ? "Hide" : "Show"} example: Sorenson &amp; Waguespack</span>
      </button>
    </div>

    <div class="model-card">
      <div class="card-header">
        <h3>Model 1 — Replicate</h3>
        <span class="role-tag">Reproduce the obvious prior</span>
      </div>
      ${fields.map(f => fieldHtml(f, s.id)).join("")}
    </div>

    <div class="model-card m2">
      <div class="card-header">
        <h3>Model 2 — Diverge</h3>
        <span class="role-tag">Introduce the difference</span>
      </div>
      ${fields2.map(f => fieldHtml(f, s.id)).join("")}
    </div>

    <div class="model-card m3">
      <div class="card-header">
        <h3>Model 3 — Reconcile</h3>
        <span class="role-tag">Reconcile — the surviving effect</span>
      </div>
      ${fields3.map(f => fieldHtml(f, s.id)).join("")}
    </div>

    <div class="stress-panel">
      <h4>Stress test before estimation</h4>
      <ul>
        <li>If Model 1 fails to replicate, the paper changes character. What do you do? (Two honest options: write the paper as a replication failure, or stop and diagnose the data.)</li>
        <li>If Models 1 and 2 yield the same answer, you have not generated a difference. Revisit Model 2.</li>
        <li>If Model 3 cannot be specified ex ante, the reconciliation is post hoc and the contribution is weaker.</li>
      </ul>
    </div>
  `;
}

function fieldHtml(f, sectionId) {
  const v = state[f.id] || "";
  const exOn = examplesShown[sectionId] ? "on" : "";
  const long = (f.prompt && f.prompt.length > 60) || (f.example && f.example.length > 80);
  const isMulti = !f.short;
  return `
    <div class="field">
      <label for="f-${f.id}">${f.label}</label>
      <div class="prompt">${f.prompt}</div>
      ${isMulti
        ? `<textarea id="f-${f.id}" data-field="${f.id}" rows="3" placeholder="Your answer…">${escapeHtml(v)}</textarea>`
        : `<input type="text" id="f-${f.id}" data-field="${f.id}" placeholder="Your answer…" value="${escapeHtml(v)}" />`
      }
      ${f.example ? `
        <div class="example ${exOn}" data-example="${sectionId}">
          <span class="ex-label">Example</span>
          ${f.example}
        </div>` : ""
      }
    </div>
  `;
}

function renderReview() {
  let html = `
    <div class="step-eyebrow">${SECTIONS[currentStep].eyebrow}</div>
    <h2 class="step-title">${SECTIONS[currentStep].title}</h2>
    <p class="step-lede">A consolidated read-out of your design. Use the controls in the header to <em>Export</em> to Markdown or <em>Print</em> as PDF. Your work is saved automatically in this browser.</p>
  `;

  // Diagram up top — the visual summary readers will see first
  html += '<div class="review-section">';
  html += '<h3>The argument as a diagram</h3>';
  html += '<div class="diagram-wrap compact" id="diagram-host">' + buildDiagramSvg();
  html += '<div class="diagram-legend">';
  html += '<span class="key"><span class="swatch sw-pref"></span>M1, the story you prefer</span>';
  html += '<span class="key"><span class="swatch sw-mech"></span>M2 and M3, the rivals — same size, same weight</span>';
  html += '<span class="key"><span class="swatch sw-theory"></span>Support from above</span>';
  html += '<span class="key"><span class="swatch sw-sig"></span>Support from below: each story\'s signature</span>';
  html += '<span class="key"><span class="swatch sw-expl"></span>The explanandum</span>';
  html += '</div></div></div>';

  SECTIONS.forEach(s => {
    if (s.custom === "intro" || s.custom === "review" || s.custom === "diagram") return;
    html += `<div class="review-section"><h3>${s.title}</h3>`;
    if (s.custom === "three_model") {
      const triplets = [
        { name: "Model 1 — Replicate", spec: "m1_spec", inf: "m1_inf" },
        { name: "Model 2 — Diverge",   spec: "m2_spec", inf: "m2_inf" },
        { name: "Model 3 — Reconcile", spec: "m3_spec", inf: "m3_inf" }
      ];
      triplets.forEach(t => {
        html += reviewItem(t.name + " — Specification", state[t.spec]);
        html += reviewItem(t.name + " — Inference licensed", state[t.inf]);
      });
    } else if (s.fields) {
      s.fields.forEach(f => {
        html += reviewItem(f.label, state[f.id]);
      });
    }
    html += `</div>`;
  });

  html += `
    <div class="pull-quote" style="margin-top: 48px">
      Yeah, yeah, yeah… but… and therefore. The yeahs honor the reader's priors. The "but" shows why those priors must be updated. The "and therefore" reconciles the two — and the reconciliation <em>is</em> the contribution.
      <cite>— Christopher I. Rider, <em>Yeah, Yeah, But… and Therefore</em></cite>
    </div>
  `;
  return html;
}

function reviewItem(k, v) {
  const empty = !v || !v.trim();
  return `<div class="review-item">
    <div class="k">${k}</div>
    <div class="v ${empty ? 'empty' : ''}">${empty ? "(not yet answered)" : escapeHtml(v)}</div>
  </div>`;
}

/* ============================================================
   HANDLERS
   ============================================================ */

function attachFieldHandlers() {
  document.querySelectorAll("[data-field]").forEach(el => {
    el.addEventListener("input", e => {
      state[el.dataset.field] = el.value;
      saveState(true);
      renderNav(); // update markers
    });
  });

  // Diagram label override fields — update SVG live
  document.querySelectorAll("[data-label-field]").forEach(el => {
    el.addEventListener("input", e => {
      state[el.dataset.labelField] = el.value;
      saveState(true);
      // Re-render only the diagram host — preserves textarea focus elsewhere
      const host = document.getElementById("diagram-host");
      if (host) {
        const legend = host.querySelector(".diagram-legend");
        host.innerHTML = buildDiagramSvg() + (legend ? legend.outerHTML : "");
      }
      renderNav();
    });
  });

  // Customize-labels panel toggle
  const labToggle = document.getElementById("lab-toggle");
  const labBody = document.getElementById("lab-body");
  if (labToggle && labBody) {
    labToggle.addEventListener("click", () => {
      const isOn = labBody.classList.toggle("on");
      labToggle.classList.toggle("on", isOn);
    });
  }
}

function attachExampleToggle(s) {
  document.querySelectorAll("[data-toggle-ex]").forEach(btn => {
    btn.addEventListener("click", () => {
      const sid = btn.dataset.toggleEx;
      examplesShown[sid] = !examplesShown[sid];
      saveState(true);
      const isOn = examplesShown[sid];
      // Update button class and label in place — no re-render, no scroll jump
      btn.classList.toggle("on", isOn);
      const textSpan = btn.querySelector("span:last-child");
      if (textSpan) {
        textSpan.textContent = (isOn ? "Hide" : "Show") + " example: Sorenson & Waguespack";
      }
      // Reveal or hide example panels for this section
      document.querySelectorAll('[data-example="' + sid + '"]').forEach(el => {
        el.classList.toggle("on", isOn);
      });
    });
  });
}

function goTo(i) {
  if (i < 0 || i >= SECTIONS.length) return;
  currentStep = i;
  saveState(true);
  renderNav();
  renderMain();
}

document.getElementById("btn-prev").addEventListener("click", () => goTo(currentStep - 1));
document.getElementById("btn-next").addEventListener("click", () => goTo(currentStep + 1));
document.getElementById("btn-save").addEventListener("click", () => saveState(false));
document.getElementById("btn-print").addEventListener("click", () => {
  // For print, jump to review so all content is visible
  const wasStep = currentStep;
  currentStep = SECTIONS.length - 1;
  renderMain();
  setTimeout(() => {
    window.print();
    currentStep = wasStep;
    renderMain();
    renderNav();
  }, 200);
});
document.getElementById("btn-reset").addEventListener("click", () => {
  showModal("Reset everything?", "This will clear every field and start fresh. This cannot be undone.", () => {
    state = {};
    examplesShown = {};
    currentStep = 0;
    saveState(true);
    renderNav();
    renderMain();
    toast("Cleared");
  });
});
document.getElementById("btn-export").addEventListener("click", exportMarkdown);

/* ============================================================
   UTILS
   ============================================================ */

function escapeHtml(s) {
  if (!s) return "";
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function padOrTrunc(s, n) {
  if (!s) return " ".repeat(n);
  s = String(s).replace(/\s+/g, " ").trim();
  if (s.length > n) return s.slice(0, n - 1) + "…";
  return s + " ".repeat(n - s.length);
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 1600);
}

function showModal(title, body, onOk) {
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-body").textContent = body;
  const m = document.getElementById("modal");
  m.classList.add("on");
  const cancel = document.getElementById("modal-cancel");
  const ok = document.getElementById("modal-ok");
  function close() {
    m.classList.remove("on");
    cancel.removeEventListener("click", close);
    ok.removeEventListener("click", confirm);
  }
  function confirm() { close(); onOk(); }
  cancel.addEventListener("click", close);
  ok.addEventListener("click", confirm);
}

   KEYBOARD

document.addEventListener("keydown", e => {
  if (e.target.matches("textarea, input")) return;
  if (e.key === "ArrowLeft") goTo(currentStep - 1);
  if (e.key === "ArrowRight") goTo(currentStep + 1);
});
